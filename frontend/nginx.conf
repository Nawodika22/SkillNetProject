server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Static frontend routing for Single Page Application
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy to user-service (Member 1 - Port 8081)
    location /api/workers/ {
        proxy_pass http://user-service:8081/api/workers/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/auth/ {
        proxy_pass http://user-service:8081/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/hr/ {
        proxy_pass http://user-service:8081/api/hr/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy to vacancy-service (Member 2 - Port 8082)
    location /api/vacancies {
        proxy_pass http://vacancy-service:8082/api/vacancies;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy to matching-service (Member 3 - Port 8083)
    location /api/matches {
        proxy_pass http://matching-service:8083/api/matches;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/notifications {
        proxy_pass http://matching-service:8083/api/notifications;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
