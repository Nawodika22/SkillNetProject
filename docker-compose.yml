name: skillnet

services:
  mysql:
    image: mysql:8.0
    container_name: skillnet-mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: skillnet_db
    ports:
      - "3308:3306"
    volumes:
      - skillnet-mysql-data:/var/lib/mysql
    networks:
      - skillnet-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: skillnet-phpmyadmin
    restart: unless-stopped
    ports:
      - "8089:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - skillnet-net

  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: skillnet-user-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: skillnet_db
      DB_USER: root
      DB_PASSWORD: ""
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - skillnet-net

  vacancy-service:
    build:
      context: ./backend/vacancy-service
      dockerfile: Dockerfile
    container_name: skillnet-vacancy-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: skillnet_db
      DB_USER: root
      DB_PASSWORD: ""
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - skillnet-net

  matching-service:
    build:
      context: ./backend/matching-service
      dockerfile: Dockerfile
    container_name: skillnet-matching-service
    restart: unless-stopped
    expose:
      - "8083"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: skillnet_db
      DB_USER: root
      DB_PASSWORD: ""
      VACANCY_SERVICE_URL: http://vacancy-service:8082
      USER_SERVICE_URL: http://user-service:8081
    depends_on:
      mysql:
        condition: service_healthy
      user-service:
        condition: service_started
      vacancy-service:
        condition: service_started
    networks:
      - skillnet-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skillnet-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "3000:80"
    depends_on:
      - user-service
      - vacancy-service
      - matching-service
    networks:
      - skillnet-net

volumes:
  skillnet-mysql-data:

networks:
  skillnet-net:
    driver: bridge

