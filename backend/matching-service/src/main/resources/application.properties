server.port=8083
spring.application.name=matching-service

spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:skillnet_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

# Microservice Inter-Service URLs
services.vacancy.url=${VACANCY_SERVICE_URL:http://localhost:8082}
services.user.url=${USER_SERVICE_URL:http://localhost:8081}