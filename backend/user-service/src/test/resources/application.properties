spring.datasource.url=jdbc:h2:mem:skillnet;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
security.jwt.secret=test-secret-that-is-at-least-32-characters-long
security.jwt.expiration=PT1H
security.hr-registration-key=test-hr-registration-key
